name: Build samples

on:
  push:
    paths:
      - 'templates/**'
      - 'examples/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'templates/**'
      - 'examples/**'

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-extra \
            texlive-lang-portuguese \
            latexmk \
            fonts-liberation \
            fonts-cascadia-code

      - name: Install HarmonyOS Sans font
        run: |
          wget -q https://github.com/zhiyuan1i/fonts-harmonyos-sans-cn/releases/download/v1.0.0/harmonyos_sans.deb -O /tmp/harmonyos_sans.deb
          sudo apt install -y /tmp/harmonyos_sans.deb
          fc-cache -f

      - name: Compile Portuguese sample
        run: |
          cd templates/guide/samples/pt
          latexmk main.tex

      - name: Compile English sample
        run: |
          cd templates/guide/samples/en
          latexmk main.tex

      - name: Compile setup guide
        run: |
          cd examples/setup-guide
          latexmk setup-guide.tex

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-pdfs
          path: |
            templates/guide/samples/pt/main.pdf
            templates/guide/samples/en/main.pdf
            examples/setup-guide/setup-guide.pdf
