name: Build samples

on:
  push:
    paths:
      - 'templates/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'templates/**'

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-extra \
            texlive-lang-portuguese \
            latexmk \
            fonts-liberation

      - name: Compile Portuguese sample
        run: |
          cd templates/guide/samples/pt
          latexmk main.tex

      - name: Compile English sample
        run: |
          cd templates/guide/samples/en
          latexmk main.tex

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-pdfs
          path: |
            templates/guide/samples/pt/main.pdf
            templates/guide/samples/en/main.pdf
